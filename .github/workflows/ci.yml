name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [users, orders]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          build-args: SERVICE=${{ matrix.service }}
          tags: ${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: imagem deve ter no máximo 40 MB
        run: |
          size=$(docker image inspect ${{ matrix.service }}:ci --format '{{.Size}}')
          echo "${{ matrix.service }}: $((size / 1024 / 1024)) MB"
          test "$size" -le $((40 * 1024 * 1024))
